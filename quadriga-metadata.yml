chapterLIST:
- title: Filmanalyse und automatisierte Annotation
  description: Verschiedene Herangehensweisen an Filmanalyse werden dargestellt und
    der Begriff Annotation definiert. Es wird geklärt, was unter automatisierter Annotation
    verstanden werden kann. Quantitative Ansätze in der Filmwissenschaft werden vorgestellt
    und mögliche Fragestellungen für die Fallstudie entwickelt.
  url: https://quadriga-dk.github.io/Bewegtes-Bild-Fallstudie-4/filmanalyse/einleitung.html
  timeRequired: PT1H
  learningGoal: Filmanalyse und automatisierte Annotation
  learningObjectiveLIST:
  - description: Die Rolle von Annotationen für filmanalytische Prozesse kann dargestellt
      werden.
    competency: 3.2 Erschließung
    dataFlow: 3 Management
    bloomsCategory: 3 Anwenden
  - description: Quantitative Ansätze in der Filmwissenschaft können beurteilt werden.
    competency: 4.1 Datenanalyse
    dataFlow: 4 Analyse
    bloomsCategory: 5 Bewerten
  - description: Mögliche Einsatzbereiche automatisierter Filmannotation können skizziert
      werden.
    competency: 3.2 Erschließung
    dataFlow: 3 Management
    bloomsCategory: 2 Verstehen
  - description: Eine Fragestellung zur quantitativen Filmanalyse kann formuliert
      werden.
    competency: nicht anwendbar
    dataFlow: nicht anwendbar
    bloomsCategory: 2 Verstehen
- title: Computer Vision für die Filmanalyse
  description: Die Funktionsweisen von Computer Vision werden dargestellt und deren
    Einsatzmöglichkeiten für die filmanalytische Praxis ausgelotet. Grundlegende Begriffe
    wie Machine Learning, Algorithmus oder Modell werden geklärt und welche Rolle
    Schwellenwerte in diesem Themenbereich spielen. Im Kapitel werden zudem die Möglichkeiten
    und Grenzen von Computer Vision für die Filmanalyse kritisch reflektiert.
  url: https://quadriga-dk.github.io/Book_Template/inhaltskapitel/einleitung.html
  timeRequired: PT1H10M
  learningGoal: Computer Vision für die Filmanalyse
  learningObjectiveLIST:
  - description: Die grundlegende Funktionsweise von Computer Vision kann beschrieben
      werden.
    competency: 4.1 Datenanalyse
    dataFlow: 4 Analyse
    bloomsCategory: 2 Verstehen
  - description: Grundlegende Begriffe wie Machine Learning, Algorithmus und Modell
      können definiert werden.
    competency: 4.1 Datenanalyse
    dataFlow: 4 Analyse
    bloomsCategory: 1 Erinnern
  - description: Die Funktion von Schwellenwerten kann erklärt werden.
    competency: 4.1 Datenanalyse
    dataFlow: 4 Analyse
    bloomsCategory: 2 Verstehen
  - description: Die Einsatzmöglichkeiten von Computer Vision für filmanalytische
      Aufgaben können benannt werden.
    competency: 4.1 Datenanalyse
    dataFlow: 4 Analyse
    bloomsCategory: 1 Erinnern
  - description: Die Möglichkeiten und Grenzen von Computer Vision Modellen können
      beurteilt werden.
    competency: 4.1 Datenanalyse
    dataFlow: 4 Analyse
    bloomsCategory: 5 Bewerten
- title: Automatisierte Annotation von Filmen
  description: Im Kapitel wird die automatisierte Annotation von Filmen wird anhand
    des Beispiels der Erkennung von Einstellungen und Figuren praktisch umgesetzt.
    Die Entwicklung des angewendeten Workflows wird dargestellt, auf die verwendeten
    Modelle eingegangen und die notwendigen technischen Voraussetzungen geklärt. Abschließend
    werden die erzeugten Annotationsdaten mit dem Filmanalysetool VIAN gesichtet und
    überprüft.
  url: https://quadriga-dk.github.io/Bewegtes-Bild-Fallstudie-4/annotation/einleitung.html
  timeRequired: PT3H
  learningGoal: Automatisierte Annotation von Filmen
  learningObjectiveLIST:
  - description: Geeignete Modelle für die Erkennung von Einstellungslängen und Figuren
      können ausgewählt werden.
    competency: 3.2 Erschließung
    dataFlow: 3 Management
    bloomsCategory: 3 Anwenden
  - description: Es können geeignete Schwellenwerte für die Erkennung angewendet werden.
    competency: 3.2 Erschließung
    dataFlow: 3 Management
    bloomsCategory: 3 Anwenden
  - description: Die grundlegenden Schritte eines Python-Skripts zur Einstellungserkennung
      und zur Figurenerkennung werden verstanden.
    competency: 3.2 Erschließung
    dataFlow: 3 Management
    bloomsCategory: 2 Verstehen
  - description: Die Python-Skripte können für eigene Annotations-Projekte modifiziert
      werden.
    competency: 3.2 Erschließung
    dataFlow: 3 Management
    bloomsCategory: 6 Erschaffen
  - description: Die Qualität der Annotationsergebnisse kann beurteilt werden.
    competency: 3.2 Erschließung
    dataFlow: 3 Management
    bloomsCategory: 5 Bewerten
- title: Auswertung der Annotationsergebnisse
  description: Im Kapitel werden die erzeugten automatisierten Annotationen ausgewertet.
    Nach der Vorstellung der Struktur der erhaltenen Annotationsdaten werden mithilfe
    von Jupyter Notebooks und Python Skripten verschiedene Visualisierungen zu den
    Annotationsdaten erstellt. Diese bilden die Grundlage einer explorativen Auswertung
    der Annotationsergebnisse.
  url: https://quadriga-dk.github.io/Bewegtes-Bild-Fallstudie-4/auswertung/einleitung.html
  timeRequired: PT1H50M
  learningGoal: Auswertung der automatisiert erstellten Annotationen
  learningObjectiveLIST:
  - description: Die Struktur der ausgegebenen Annotationen wird verstanden.
    competency: 3.2 Erschließung
    dataFlow: 3 Management
    bloomsCategory: 1 Erinnern
  - description: Die Annotationen können quantitativ ausgewertet werden.
    competency: 4.1 Datenanalyse
    dataFlow: 4 Analyse
    bloomsCategory: 5 Bewerten
  - description: Die Annotationen können mit Python-Skripten sinnvoll visualisiert
      werden.
    competency: 4.2 Visualisierung
    dataFlow: 4 Analyse
    bloomsCategory: 3 Anwenden
  - description: Die Ergebnisse aus den Annotationen können analysiert werden.
    competency: 4.1 Datenanalyse
    dataFlow: 4 Analyse
    bloomsCategory: 4 Analysieren
