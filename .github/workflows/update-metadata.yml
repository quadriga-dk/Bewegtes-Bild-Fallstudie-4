name: Update Metadata

on:
  push:
  workflow_dispatch:

# Prevent infinite loops when workflow commits changes
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  update-metadata:
    runs-on: ubuntu-latest
    # Need write permission to push changes
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
        with:
          ref: ${{ github.ref }}
          fetch-depth: 0

      - name: Extract version from tag (if triggered by tag)
        id: extract_version
        run: |
          if [[ "$GITHUB_REF" == refs/tags/v* ]]; then
            TAG_NAME=${GITHUB_REF#refs/tags/}
            # Remove 'v' prefix if present (v1.0.0 -> 1.0.0)
            VERSION=${TAG_NAME#v}
            echo "version=$VERSION" >> $GITHUB_OUTPUT
            echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
            echo "is_tag=true" >> $GITHUB_OUTPUT
            echo "Triggered by version tag: $TAG_NAME (version: $VERSION)"
          else
            echo "is_tag=false" >> $GITHUB_OUTPUT
            echo "Triggered by regular push to: $GITHUB_REF"
          fi

      - name: Set up Python
        id: setup-python
        uses: actions/setup-python@v7
        with:
          python-version-file: '.python-version'
          cache: pip

      # dev-requirements.txt is unpinned, so the cache key rotates monthly.
      # Without this, an exact hit would freeze ruff/mypy/rdflib/jsonschema at
      # whatever versions were first cached and never pick up upstream releases.
      # Rolling the key forces one clean install per month, which is what a
      # plain `pip install -r dev-requirements.txt` would have resolved anyway.
      - name: Get cache rotation stamp
        id: cache-stamp
        run: echo "stamp=$(date -u +'%Y-%m')" >> "$GITHUB_OUTPUT"

      # Restore the installed dev dependencies (virtual environment). Unlike
      # setup-python's `cache: pip` (downloads only), this lets the install step
      # be skipped entirely on an exact hit. Split into restore + save so the
      # venv is persisted before the metadata steps run, and therefore survives
      # a `cancel-in-progress` cancellation from a concurrent push.
      # No restore-keys on purpose: bridging months would restore an older venv,
      # and plain `pip install` does not upgrade already-satisfied unpinned
      # packages, so the monthly refresh would silently do nothing.
      - name: Restore cached Python dependencies
        id: deps-cache
        uses: actions/cache/restore@v5
        with:
          path: .venv
          key: python-deps-dev-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('dev-requirements.txt') }}-${{ steps.cache-stamp.outputs.stamp }}

      # Install with `.venv/bin/python -m pip`, NOT a bare `pip`: the venv is
      # only added to PATH by the "Activate" step below (which affects subsequent
      # steps), so a bare `python`/`pip` here targets setup-python's global
      # site-packages and leaves the venv empty -- and an empty venv then gets
      # cached, poisoning every later run.
      - name: Create virtual environment and install dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        run: |
          python -m venv .venv
          .venv/bin/python -m pip install --upgrade pip
          .venv/bin/python -m pip install -r dev-requirements.txt

      # Fail loudly if the venv is empty/missing packages, so a broken
      # environment is never written to the cache (and a bad restored cache is
      # caught instead of silently failing later).
      - name: Verify virtual environment
        run: .venv/bin/python -c "import yaml, rdflib"

      - name: Save cached Python dependencies
        if: steps.deps-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v5
        with:
          path: .venv
          key: python-deps-dev-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('dev-requirements.txt') }}-${{ steps.cache-stamp.outputs.stamp }}

      - name: Activate virtual environment
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Update version metadata (if triggered by tag)
        if: steps.extract_version.outputs.is_tag == 'true'
        env:
          TAG_VERSION: ${{ steps.extract_version.outputs.version }}
        run: |
          python -m quadriga.metadata.update_version_from_tag

      - name: Update metadata files
        env:
          PYTHONHASHSEED: 0
        run: python -m quadriga.metadata.run_all

      - name: Stage metadata files
        run: |
          # Add all metadata files that exist (handles both new and modified files)
          for file in metadata.yml CITATION.bib CITATION.cff .zenodo.json metadata.jsonld metadata.rdf; do
            [ -f "$file" ] && git add "$file"
          done

      - name: Check if files staged
        id: check_changes
        run: |
          if git diff --cached --quiet; then
            echo "changes_detected=false" >> $GITHUB_OUTPUT
          else
            echo "changes_detected=true" >> $GITHUB_OUTPUT
          fi

      - name: Commit changes (regular push)
        if: steps.check_changes.outputs.changes_detected == 'true' && steps.extract_version.outputs.is_tag == 'false'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "[Automated] Update metadata files"
          git push

      - name: Commit changes and move tag (tag-triggered)
        if: steps.check_changes.outputs.changes_detected == 'true' && steps.extract_version.outputs.is_tag == 'true'
        run: |
          git config --local user.email "github-actions[bot]@users.noreply.github.com"
          git config --local user.name "github-actions[bot]"
          git commit -m "[Automated] Update metadata for version ${{ steps.extract_version.outputs.version }}"

          # Delete the old tag (locally and remotely)
          git tag -d ${{ steps.extract_version.outputs.tag_name }}
          git push origin :refs/tags/${{ steps.extract_version.outputs.tag_name }}

          # Create new tag at the current commit (with updated metadata)
          git tag ${{ steps.extract_version.outputs.tag_name }}

          # Push the changes and the new tag
          git push origin HEAD:main
          git push origin ${{ steps.extract_version.outputs.tag_name }}

          echo "Tag ${{ steps.extract_version.outputs.tag_name }} moved to commit with updated metadata"

      - name: No changes needed
        if: steps.check_changes.outputs.changes_detected == 'false'
        run: |
          if [[ "${{ steps.extract_version.outputs.is_tag }}" == "true" ]]; then
            echo "Metadata already matches the tag version - no changes needed"
          else
            echo "No metadata changes detected"
          fi
