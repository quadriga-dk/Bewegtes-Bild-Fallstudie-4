name: Deploy book

# Deliberately no `workflow_dispatch` here: this workflow holds Pages/OIDC and
# artifact permissions and restores caches below, so a manual dispatch could run
# it against an untrusted branch and poison those caches (CodeQL: "Cache
# Poisoning via caching of untrusted files"). To redeploy manually, dispatch the
# "Update Metadata" workflow instead - its completion triggers this one.
on:
  workflow_run:
    workflows: ["Update Metadata"]
    types:
      - completed
    branches:
      - main

# Serialise Pages deployments. Two deployments running at the same time fail
# with "Deployment request failed ... due to in progress deployment".
concurrency:
  group: github-pages
  cancel-in-progress: false

# This job installs dependencies, builds the book, and deploys it to GitHub Pages
# only runs if "Update Metadata" workflow is successful
permissions:
  contents: read
  pages: write
  id-token: write
  # Needed to delete stale "github-pages" artifacts left behind by earlier
  # attempts of the same workflow run before uploading a new one.
  actions: write

jobs:
  deploy-book:
    runs-on: ubuntu-latest
    # The book build alone can take a while; keep the deploy step from being
    # cut off by the default job timeout.
    timeout-minutes: 90
    if: github.event.workflow_run.conclusion == 'success'
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7
      with:
        # Build the commit whose "Update Metadata" run just finished instead of
        # whatever the default branch points at when this job starts.
        ref: ${{ github.event.workflow_run.head_sha || github.sha }}

    # Set up Python with pip caching
    - name: Set up Python
      id: setup-python
      uses: actions/setup-python@v7
      with:
        python-version-file: '.python-version'
        cache: pip

    # Restore the cached installed packages (virtual environment).
    # Note: setup-python's `cache: pip` only caches pip's download cache
    # (~/.cache/pip); the install step still re-installs every package on each
    # run. Caching .venv lets us skip `pip install` entirely on an exact hit.
    # Key on the *resolved* Python version (not .python-version, which is the
    # constant "3.10"): the venv's bin/python symlink and pyvenv.cfg point into
    # the runner's Python toolcache, so a patch bump must invalidate the cache.
    # Split into restore + save (below) instead of the monolithic actions/cache
    # so the installed venv is persisted even if a later step (the book build)
    # fails.
    - name: Restore cached Python dependencies
      id: deps-cache
      uses: actions/cache/restore@v6
      with:
        path: .venv
        key: python-deps-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}
        restore-keys: |
          python-deps-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-

    # Cache executed notebooks
    # only caches if set up in _config.yml with:
    # execute:
    #   execute_notebooks: cache
    - name: Cache executed notebooks
      uses: actions/cache@v6
      with:
        path: _build/.jupyter_cache
        key: jupyter-book-cache-${{ hashFiles('requirements.txt') }}

    # Only create the venv and install dependencies on a cache miss.
    # Install with `.venv/bin/python -m pip`, NOT a bare `pip`: the venv is only
    # added to PATH by the "Activate" step below (which affects subsequent
    # steps), so a bare `python`/`pip` here targets setup-python's global
    # site-packages and leaves the venv empty -- and an empty venv then gets
    # cached, poisoning every later run.
    - name: Create virtual environment and install dependencies
      if: steps.deps-cache.outputs.cache-hit != 'true'
      run: |
        python -m venv .venv
        .venv/bin/python -m pip install --upgrade pip
        .venv/bin/python -m pip install -r requirements.txt

    # Fail loudly if the venv is empty/missing packages, so a broken
    # environment is never written to the cache (and a bad restored cache is
    # caught instead of silently failing later).
    - name: Verify virtual environment
      run: .venv/bin/python -c "import jupyter_book, matplotlib"

    # Persist the venv immediately after installing, before the build runs, so
    # a failure in a later step (e.g. `jupyter-book build`) does not throw away
    # the install. On a restore-key partial hit this writes the updated venv
    # under the new requirements hash. A concurrent-run save race is handled by
    # the action as a non-fatal warning, so this step cannot fail the job for
    # that reason.
    - name: Save cached Python dependencies
      if: steps.deps-cache.outputs.cache-hit != 'true'
      uses: actions/cache/save@v6
      with:
        path: .venv
        key: python-deps-${{ runner.os }}-${{ steps.setup-python.outputs.python-version }}-${{ hashFiles('requirements.txt') }}

    # Expose the venv's binaries (jupyter-book, jupyter, python, ...) to all
    # subsequent steps
    - name: Activate virtual environment
      run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

    # Check all kernels
    - name: Log all available kernels
      run: |
        jupyter kernelspec list

    - name: Build the book
      run: |
        jupyter-book build .

    - name: Inject all metadata into HTML
      run: |
        python -m quadriga.metadata.inject_all_metadata
        echo "Injected all metadata (OpenGraph, JSON-LD, and RDF links) into HTML head"

    - name: Copy metadata files to build directory
      run: |
        cp quadriga-metadata.jsonld _build/html/quadriga-metadata.jsonld
        cp quadriga-metadata.rdf _build/html/quadriga-metadata.rdf
        echo "Copied metadata files to _build/html for discovery"

    # A re-run of this workflow appends another artifact named "github-pages"
    # to the same run instead of replacing the previous one. deploy-pages then
    # aborts with "Multiple artifacts named github-pages were unexpectedly
    # found". Drop leftovers first so a re-run is as good as a fresh run.
    - name: Delete stale Pages artifacts from earlier attempts
      env:
        GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      run: |
        gh api --paginate "repos/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}/artifacts" \
          --jq '.artifacts[] | select(.name == "github-pages") | .id' |
        while read -r artifact_id; do
          echo "Deleting stale artifact ${artifact_id}"
          gh api --method DELETE "repos/${GITHUB_REPOSITORY}/actions/artifacts/${artifact_id}"
        done

    - name: Upload book artifact
      uses: actions/upload-pages-artifact@v5
      with:
        path: "_build/html"

    - name: Deploy to GitHub Pages
      id: deployment
      uses: actions/deploy-pages@v5
      with:
        # Pages can be slow to sync large sites; the default of 10 minutes
        # turned a slow sync into a failed deployment.
        timeout: 1200000
